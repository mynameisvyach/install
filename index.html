<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>soon...</title>

  <!-- Favicon: точная копия логотипа VY со страницы -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100'%3E%3Ctext x='50%25' y='70' font-family='Brush Script MT, cursive' font-size='80' fill='%23e6f0ff' font-weight='bold' text-anchor='middle' style='letter-spacing:-5px;'%3EVY%3C/text%3E%3C/svg%3E">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(270deg, #0a0f1c, #1a2a3a, #0a0f1c);
      background-size: 600% 600%;
      animation: gradientMove 20s ease-in-out infinite;
      color: white;
      overflow: hidden;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* Стиль для текста "SOON...." */
    .soon-text {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(3.5rem, 14vw, 7rem);
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #ffffff, #a0c4ff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      animation: textGlow 3s ease-in-out infinite;
    }

    @keyframes textGlow {
      0%, 100% {
        opacity: 0.9;
        filter: drop-shadow(0 0 5px rgba(77, 163, 255, 0.3));
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 15px rgba(77, 163, 255, 0.6));
      }
    }

    footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: #888;
      font-family: 'Space Grotesk', sans-serif;
      z-index: 2;
      animation: fadePulse 6s ease-in-out infinite;
    }

    @keyframes fadePulse {
      0%,100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }

    /* SVG CHAOTIC LINES */
    .bg-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .path {
      fill: none;
      stroke: #4da3ff;
      stroke-width: 1.2;
      opacity: 0.2;
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: smoothDraw 12s ease-in-out infinite alternate;
    }

    @keyframes smoothDraw {
      0% {
        stroke-dashoffset: 400;
        opacity: 0.05;
      }
      25% {
        opacity: 0.25;
      }
      50% {
        stroke-dashoffset: 0;
        opacity: 0.3;
      }
      75% {
        opacity: 0.25;
      }
      100% {
        stroke-dashoffset: 400;
        opacity: 0.05;
      }
    }

    .path-1 {
      animation-duration: 14s;
      animation-delay: 0s;
    }
    .path-2 {
      animation-duration: 18s;
      animation-delay: 2s;
    }
    .path-3 {
      animation-duration: 16s;
      animation-delay: 5s;
    }
    .path-4 {
      animation-duration: 20s;
      animation-delay: 1s;
    }
    .path-5 {
      animation-duration: 22s;
      animation-delay: 7s;
    }
    .path-6 {
      animation-duration: 15s;
      animation-delay: 3s;
    }

    @media (max-width: 600px) {
      footer {
        font-size: 10px;
        bottom: 15px;
      }
      .path {
        stroke-width: 0.8;
      }
    }
  </style>
</head>
<body>

<svg class="bg-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <path class="path path-1" d="M0,200 C200,300 300,100 500,200 S800,300 1000,200" />
  <path class="path path-2" d="M0,600 C200,500 400,700 600,600 S900,500 1000,600" />
  <path class="path path-3" d="M0,400 C150,450 350,350 550,400 S850,450 1000,400" />
  <path class="path path-4" d="M0,800 C250,750 450,850 700,800 S950,750 1000,800" />
  <path class="path path-5" d="M100,900 C300,850 500,950 700,900 S900,850 1000,900" />
  <path class="path path-6" d="M0,100 C150,50 350,150 550,100 S850,50 1000,100" />
</svg>

<div class="container">
  <div class="soon-text">SOON....</div>
</div>

<footer>
  © 2026 Revival Corp — Все права защищены
</footer>

</body>
</html>
